# Orange Pi Zero2 (H616) print server
# Usage (from the project root; build.sh passes its arguments to compile.sh):
#   ./build.sh                       minimal image (default, BUILD_MINIMAL=yes)
#   ./build.sh OPIZ2_VARIANT=server  standard Armbian CLI/server image (BUILD_MINIMAL=no)
#   ./build.sh OPIZ2_VARIANT=desktop desktop image (BUILD_DESKTOP=yes, GNOME as Armbian's own orangepizero2
#                                    image; OPIZ2_DESKTOP_DE=xfce switches) + the v4l2-request FFmpeg/mpv
# or directly: ./compile.sh opiz2-printserver [OPIZ2_VARIANT=server]
#
# Variants: this file is the single source of truth for all three; every setting and hook below applies to
# all of them unless it says otherwise. They share the kernel, U-Boot, firmware and BSP artifacts and ccache;
# only the rootfs cache differs (cache/rootfs/rootfs-arm64-stonking-{minimal,cli}_*), and the image names
# differ (..._minimal.img.xz vs ....img.xz), so both images can sit side by side in output/images.
#   minimal  systemd-networkd + timesyncd, no Recommends, no armbian-config/zsh/plymouth.
#   server   Armbian's standard CLI set: config/cli/stonking/main/packages.additional, NetworkManager
#            (+ netplan) + chrony, armbian-zsh, plymouth (no splash: BOOT_LOGO=desktop) and armbian-config
#            (installed from github.armbian.com/configng by a hook below, since SKIP_ARMBIAN_REPO=yes skips
#            Armbian's own install). Network identity, SD-wear tuning, WiFi regdomain, rusticl, libclc and
#            the CUPS setup are the same as on minimal (see customize-image.sh for the NetworkManager side).
#   desktop  server + a desktop (DESKTOP_ENVIRONMENT, installed by armbian-config's module_desktops) + our
#            FFmpeg with the V4L2 Request API hwaccels and mpv with the v4l2request hwdec (scripts/build-media-debs.sh,
#            out/debs-media), so mpv/ffmpeg decode on cedrus. minimal and server get no FFmpeg.
# Hooks key on the effective BUILD_MINIMAL / NETWORKING_STACK, not on OPIZ2_VARIANT, so overrides such as
# BUILD_MINIMAL=no or NETWORKING_STACK=systemd-networkd on the command line stay consistent.
#
# - Ubuntu 26.10 "stonking" userspace (added locally; not in upstream Armbian yet)
# - Armbian "edge" kernel branch = mainline 7.3.x + sunxi-7.3 patch set
# - Broad printer support (see package list below)
# - U-Boot v2026.10 + TF-A lts-v2.14 (Armbian sunxi64 defaults)

BOARD="orangepizero2"
BRANCH="edge"
RELEASE="stonking"

declare -g OPIZ2_VARIANT="${OPIZ2_VARIANT:-minimal}"
case "${OPIZ2_VARIANT}" in
	minimal) BUILD_MINIMAL="yes" BUILD_DESKTOP="no" ;;
	server) BUILD_MINIMAL="no" BUILD_DESKTOP="no" ;;
	desktop) BUILD_MINIMAL="no" BUILD_DESKTOP="yes" ;;
	*) exit_with_error "OPIZ2_VARIANT must be 'minimal', 'server' or 'desktop'" "${OPIZ2_VARIANT}" ;;
esac

# Desktop (OPIZ2_VARIANT=desktop). The DE is the one variable OPIZ2_DESKTOP_DE (gnome | xfce | any configng DE).
# GNOME with the same settings as Armbian's standard orangepizero2 desktop image (armbian/os
# userpatches/targets-release-community-maintained.yaml, target gnome-desktop-stable-ubuntu). The current framework
# maps a non-empty DESKTOP_APPGROUPS_SELECTED to DESKTOP_TIER=full (config-desktop.sh); DESKTOP_TIER=minimal|mid on
# the command line overrides that. armbian/configng has no stonking definitions yet: see the custom_apt_repo hook below.
declare -g OPIZ2_DESKTOP_DE="${OPIZ2_DESKTOP_DE:-gnome}"
if [[ "${BUILD_DESKTOP}" == "yes" ]]; then
	declare -g DESKTOP_ENVIRONMENT="${DESKTOP_ENVIRONMENT:-${OPIZ2_DESKTOP_DE}}"
	declare -g DESKTOP_ENVIRONMENT_CONFIG_NAME="${DESKTOP_ENVIRONMENT_CONFIG_NAME:-config_base}"
	declare -g DESKTOP_APPGROUPS_SELECTED="${DESKTOP_APPGROUPS_SELECTED-browsers,chat,desktop_tools,editors,email,internet,languages,multimedia,office,programming,remote_desktop}"
fi
KERNEL_CONFIGURE="no"
# Kernel package version: "<mainline>+opiz2.<rev>" (e.g. 7.3.1+opiz2.1) instead of the Armbian
# release number. Bump the rev for each release kernel; reset it to 1 on each mainline rebase.
declare -g OPIZ2_KERNEL_REV="${OPIZ2_KERNEL_REV:-1}"
declare -g KERNEL_PACKAGE_VERSION_TAG="opiz2.${OPIZ2_KERNEL_REV}"
# Kernel BTF stays on (Armbian default; BPF CO-RE and out-of-tree module BTF need it).

# apt.armbian.com has no stonking suite; build all Armbian packages locally
# and do not configure the Armbian apt repo in the image.
SKIP_ARMBIAN_REPO="yes"

COMPRESS_OUTPUTIMAGE="sha,img,xz"
EXPERT="yes"

# Build caching (rule #1): ccache for kernel/U-Boot/TF-A, kept in the build tree (cache/ccache) because
# compile.sh runs the compiles as root. Armbian artifact caches (kernel/u-boot/rootfs) are on by default.
enable_extension "ccache"
declare -g PRIVATE_CCACHE=yes

# Print + scan server: CUPS + driverless (IPP Everywhere/AirPrint over network, IPP-over-USB
# via ipp-usb) + every printer-driver-* in the Ubuntu archive + HPLIP + PPD collections.
# Scan: ipp-usb exposes the MFP's eSCL (AirScan/Mopria) to the LAN, sane-airscan + hpaio
# (libsane-hpaio) as local SANE backends, saned shares them with SANE clients.
# Listed explicitly because minimal builds don't install Recommends, so the
# printer-driver-all metapackage alone would pull in nothing.
function post_family_config__opiz2_printserver_packages() {
	add_packages_to_image \
		cups cups-client cups-bsd cups-filters cups-browsed ipp-usb ghostscript \
		sane-utils sane-airscan libsane-hpaio \
		avahi-daemon libnss-mdns \
		foomatic-db-compressed-ppds openprinting-ppds hplip \
		printer-driver-brlaser printer-driver-c2050 printer-driver-c2esp printer-driver-cjet \
		printer-driver-dymo printer-driver-escpr printer-driver-foo2zjs printer-driver-fujixerox \
		printer-driver-gutenprint printer-driver-hpcups printer-driver-indexbraille \
		printer-driver-m2300w printer-driver-min12xxw printer-driver-oki printer-driver-pnm2ppa \
		printer-driver-postscript-hp printer-driver-ptouch printer-driver-pxljr \
		printer-driver-sag-gdi printer-driver-splix
}

# Board hardware support (spec acceptance, docs/spec-checklist.md): Mali-G31 userspace
# (panfrost GLES 3.1 + rusticl OpenCL 3.0), plus the tools the hardware tests use:
# video decode (v4l2codecs), HDMI/CEC, IR, audio, GPIO/I2C/SPI-NOR, WiFi/BT, load/latency.
# gstreamer1.0-libav is in every variant: it is the software decoder decodebin falls back to
# when the hardware path (v4l2codecs on cedrus) does not take a stream (an older kernel
# without the coded format, a size or feature the engine refuses); without it the image had no
# software MPEG-1/2, H.264 or H.265 decoder at all for GStreamer (runner job 12-gst-mpeg1:
# "Missing element: MPEG-1 Video decoder").
function post_family_config__opiz2_hw_support_packages() {
	add_packages_to_image \
		libgl1-mesa-dri libegl-mesa0 libgles2 mesa-opencl-icd clinfo mesa-utils mesa-vulkan-drivers vulkan-tools \
		glmark2-es2-drm kmscube libdrm-tests \
		v4l-utils gstreamer1.0-tools gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-alsa \
		gstreamer1.0-libav \
		cec-utils ir-keytable evtest alsa-utils \
		gpiod i2c-tools mtd-utils lm-sensors \
		iperf3 bluez stress-ng rt-tests \
		iw wireless-regdb hostapd wpasupplicant
}

# rusticl only exposes drivers listed in RUSTICL_ENABLE.
function image_specific_armbian_env_ready__opiz2_rusticl() {
	grep -q '^RUSTICL_ENABLE=' "${SDCARD}/etc/environment" 2>/dev/null ||
		echo 'RUSTICL_ENABLE=panfrost' >> "${SDCARD}/etc/environment"
}

# GStreamer JPEG: autoplugging (playbin, decodebin, gst-play) must not pick v4l2jpegdec. It ranks
# PRIMARY+1, above the software jpegdec, but cannot drive cedrus (stateless; v4l2jpegdec expects the
# stateful protocol): on the board it outputs nothing for colour JPEGs and hangs on greyscale
# (harness/research/impl-di-jpeg-avs.md 7.6). MARGINAL keeps it installed and usable in explicit
# pipelines. Login shells read /etc/environment; system and user services get the same value
# through systemd's DefaultEnvironment.
function image_specific_armbian_env_ready__opiz2_gst_jpeg_rank() {
	local v='GST_PLUGIN_FEATURE_RANK=v4l2jpegdec:MARGINAL' d
	grep -q '^GST_PLUGIN_FEATURE_RANK=' "${SDCARD}/etc/environment" 2>/dev/null ||
		echo "${v}" >> "${SDCARD}/etc/environment"
	for d in system.conf.d user.conf.d; do
		mkdir -p "${SDCARD}/etc/systemd/${d}"
		printf '[Manager]\nDefaultEnvironment="%s"\n' "${v}" > "${SDCARD}/etc/systemd/${d}/60-opiz2-gst-jpeg-rank.conf"
	done
}

# Ethernet MTU (jumbo frames). Default: unset, the MTU stays 1500 (or what DHCP sends). The EMAC
# takes frames up to 2044 bytes in one descriptor, so the kernel caps end0 at MTU 2018
# (harness/research/impl-emac-jumbo.md). Every host on the segment must use the same MTU.
# Build with OPIZ2_ETH_MTU=2018 (68..2018) to fix it at boot. It also stops the DHCP MTU option from
# resetting it on every link bounce (networkd UseMTU). On a running image, edit
# /etc/netplan/30-opiz2-eth-mtu.yaml (minimal image, then `netplan apply`) or
# /etc/NetworkManager/conf.d/zz-40-opiz2-eth-mtu.conf (server image, then restart NetworkManager;
# board-tested 2026-11-05: end0 comes up at 2018). Removing the setting does not lower the MTU of a
# link that is up: run `ip link set end0 mtu 1500` or reboot.
declare -g OPIZ2_ETH_MTU="${OPIZ2_ETH_MTU:-}"
function post_customize_image__opiz2_eth_mtu() {
	[[ -n "${OPIZ2_ETH_MTU}" ]] || return 0
	if ! [[ "${OPIZ2_ETH_MTU}" =~ ^[0-9]+$ ]] || ((OPIZ2_ETH_MTU < 68 || OPIZ2_ETH_MTU > 2018)); then
		exit_with_error "OPIZ2_ETH_MTU=${OPIZ2_ETH_MTU}: must be 68..2018 (EMAC single-descriptor limit)"
	fi
	if [[ -e "${SDCARD}/etc/netplan/10-dhcp-all-interfaces.yaml" ]]; then
		cat > "${SDCARD}/etc/netplan/30-opiz2-eth-mtu.yaml" <<- NETPLAN
			network:
			  version: 2
			  ethernets:
			    all-eth-interfaces:
			      mtu: ${OPIZ2_ETH_MTU}
			      dhcp4-overrides:
			        use-mtu: false
		NETPLAN
		chmod 600 "${SDCARD}/etc/netplan/30-opiz2-eth-mtu.yaml"
	fi
	if [[ -e "${SDCARD}/etc/netplan/00-default-use-network-manager.yaml" ]]; then
		mkdir -p "${SDCARD}/etc/NetworkManager/conf.d"
		printf '[connection-opiz2-eth-mtu]\nmatch-device=type:ethernet\nethernet.mtu=%s\n' "${OPIZ2_ETH_MTU}" \
			> "${SDCARD}/etc/NetworkManager/conf.d/zz-40-opiz2-eth-mtu.conf"
	fi
	display_alert "Ethernet MTU" "${OPIZ2_ETH_MTU}" "info"
}

# OpenCL: Ubuntu's upstream libclc-22 leaves `__clc_flush_denormal_if_not_supported` unresolved,
# so rusticl rejects every kernel that calls sin()/cos() ("nir_shader not fully linked").
# Mesa's libclc fork is the documented drop-in fix (harness/research/impl-gpu-spec.md §3.3).
# Pinned by version + sha256 and cached under cache/sources, so rebuilds do not download it again.
# dpkg-divert keeps an apt upgrade of libclc-22 from putting the broken file back.
declare -g OPIZ2_MESA_LIBCLC_VER="22.1.8.3"
declare -g OPIZ2_MESA_LIBCLC_SHA256="728cdfa747a1857829c104291984964971783a301a62e9468a3d5a4f1750c949"
function post_customize_image__opiz2_mesa_libclc() {
	local f="spirv64-mesa3d-.spv" cache="${SRC}/cache/sources/opiz2-mesa-libclc/${OPIZ2_MESA_LIBCLC_VER}"
	local url="https://gitlab.freedesktop.org/api/v4/projects/27606/packages/generic/mesa-libclc/${OPIZ2_MESA_LIBCLC_VER}/${f}"
	[[ -f "${SDCARD}/usr/lib/clc/${f}" ]] || { display_alert "mesa-libclc" "no libclc in image, skipped" "wrn"; return 0; }
	mkdir -p "${cache}"
	if ! echo "${OPIZ2_MESA_LIBCLC_SHA256}  ${cache}/${f}" | sha256sum -c --status 2> /dev/null; then
		run_host_command_logged curl -fsSL --retry 3 -o "${cache}/${f}.part" "${url}"
		echo "${OPIZ2_MESA_LIBCLC_SHA256}  ${cache}/${f}.part" | sha256sum -c --status ||
			exit_with_error "mesa-libclc ${OPIZ2_MESA_LIBCLC_VER}: sha256 mismatch" "${url}"
		mv "${cache}/${f}.part" "${cache}/${f}"
	fi
	chroot_sdcard dpkg-divert --package opiz2-mesa-libclc --rename \
		--divert "/usr/lib/clc/${f}.distrib" --add "/usr/lib/clc/${f}"
	install -m 0644 "${cache}/${f}" "${SDCARD}/usr/lib/clc/${f}"
	display_alert "mesa-libclc" "${OPIZ2_MESA_LIBCLC_VER} installed over the distro libclc (diverted)" "info"
}

# SD-card wear: root has only the one SD card (the single USB-A port is the printer's).
# Set the ext4 root options here once fstab exists: noatime + 10-minute journal commit.
# TUNING_PROFILE=none: Armbian's tuning profile would be applied by armbian-config on first boot
# (armbian-firstrun). Minimal has no armbian-config, so it never applied there (the build dropped
# the pending profile). The server image has armbian-config, and the default "sbc" profile would
# replace commit=600 with commit=120 and change vm.swappiness etc. "none" keeps both variants on the
# settings below. A profile can still be applied later: armbian-config --api module_tuning_profile apply <p>.
declare -g TUNING_PROFILE="${TUNING_PROFILE:-none}"
function image_specific_armbian_env_ready__opiz2_sd_wear() {
	sed -i -E 's|^(UUID=[^ ]+ / ext4 defaults)(,errors=remount-ro)|\1,noatime,commit=600\2|' "${SDCARD}/etc/fstab"
	grep -q ' /var/spool/cups ' "${SDCARD}/etc/fstab" ||
		echo 'tmpfs /var/spool/cups tmpfs defaults,nosuid,nodev,mode=0710,uid=root,gid=lp,size=64M 0 0' >> "${SDCARD}/etc/fstab"
	display_alert "SD wear tuning" "noatime,commit=600 on /; CUPS spool on tmpfs" "info"
}

# WiFi regulatory domain (UWE5622). The kernel starts in the world domain "00", where 5 GHz is
# passive-scan/no-IR, so a 5 GHz access point cannot start. The driver passes cfg80211's rules
# to the firmware (drv-net-wireless-uwe5622-regdomain-from-cfg80211.patch). That means the domain
# follows, in order: this knob, then `iw reg set XX`, hostapd's country_code= or wpa_supplicant's
# country=, then the country element of the AP the board associates with.
# Build with OPIZ2_WIFI_REGDOM=US (any ISO 3166 alpha2) to fix it at boot. On a running image,
# edit /etc/modprobe.d/cfg80211-regdom.conf instead; it applies when cfg80211 is next loaded (reboot).
declare -g OPIZ2_WIFI_REGDOM="${OPIZ2_WIFI_REGDOM:-}"
function post_customize_image__opiz2_wifi_regdom() {
	local f="${SDCARD}/etc/modprobe.d/cfg80211-regdom.conf"
	{
		echo "# WiFi regulatory domain at boot (ISO 3166 alpha2). Without it the kernel starts in"
		echo "# the world domain \"00\" and follows iw reg set / hostapd country_code= / the AP's"
		echo "# country element. 5 GHz AP mode needs a real country. Reboot to apply."
		if [[ "${OPIZ2_WIFI_REGDOM}" =~ ^[A-Z]{2}$ ]]; then
			echo "options cfg80211 ieee80211_regdom=${OPIZ2_WIFI_REGDOM}"
		else
			echo "#options cfg80211 ieee80211_regdom=US"
		fi
	} > "${f}"
	display_alert "WiFi regulatory domain" "${OPIZ2_WIFI_REGDOM:-follow AP/user (world 00 at boot)}" "info"
}

# armbian-config (server variant). Armbian installs it in post_armbian_repo_customize_image, which
# SKIP_ARMBIAN_REPO=yes skips. The image still carries Armbian's configng source
# (/etc/apt/sources.list.d/armbian-config.sources, arch: all, independent of the missing stonking
# suite), so install it from there. Its dependencies all resolve in stonking (expect-dev is provided
# by expect). A failed download only warns: the image works without it.
function post_repo_customize_image__opiz2_armbian_config() {
	[[ "${BUILD_MINIMAL}" == "yes" || "${SKIP_ARMBIAN_REPO}" != "yes" ]] && return 0
	if [[ ! -f "${SDCARD}/etc/apt/sources.list.d/armbian-config.sources" ]]; then
		display_alert "armbian-config" "no configng apt source in the image, not installed" "wrn"
		return 0
	fi
	if chroot_sdcard_apt_get_install armbian-config; then
		display_alert "armbian-config" "installed from github.armbian.com/configng" "info"
	else
		display_alert "armbian-config" "install failed, image continues without it" "wrn"
	fi
}

# Desktop on stonking: armbian/configng's desktop YAML (tools/modules/desktops/yaml) lists no "stonking" release, so
# module_desktops would install the DE without the release block (it only warns "not supported") and with the
# browser token unresolved. Before rootfs-create installs the desktop, install armbian-config here (from the configng
# source the armbian-config extension added just before this hook) and give its YAML a stonking entry = resolute
# (userpatches/desktop/configng-add-release.py; the same change is queued as a configng PR in docs/upstream-queue.md).
# Without the Armbian apt repo (SKIP_ARMBIAN_REPO=yes) the apt.armbian.com-only packages (chromium, code,
# armbian-imager) and Ubuntu's snap-transitional .debs are dropped and the browser is epiphany-browser.
# The rootfs cache key does not include this hook: after changing it, delete cache/rootfs/rootfs-arm64-stonking-*-desktop-*.
function custom_apt_repo__opiz2_desktop_stonking_configng() {
	[[ "${BUILD_DESKTOP}" == "yes" && "${CUSTOM_REPO_WHEN}" == "root" ]] || return 0
	local yaml_dir="${SDCARD}/usr/share/armbian-config/desktops/yaml" extra=()
	[[ "${SKIP_ARMBIAN_REPO}" == "yes" ]] && extra+=(--no-armbian-repo)
	chroot_sdcard_apt_get_update
	chroot_sdcard_apt_get_install armbian-config
	[[ -d "${yaml_dir}" ]] || exit_with_error "armbian-config has no desktop YAML" "${yaml_dir}"
	if ! grep -qs "^  ${RELEASE}:" "${yaml_dir}/${DESKTOP_ENVIRONMENT}.yaml" || [[ ${#extra[@]} -gt 0 ]]; then
		run_host_command_logged python3 -I "${USERPATCHES_PATH}/desktop/configng-add-release.py" \
			"${yaml_dir}" "${RELEASE}" "${OPIZ2_DESKTOP_YAML_BASE:-resolute}" "${extra[@]}"
	fi
	display_alert "armbian-config desktops" "${RELEASE} = ${OPIZ2_DESKTOP_YAML_BASE:-resolute} ${extra[*]}" "info"
}

# Desktop media stack: our rebuilds of Ubuntu's ffmpeg (V4L2 Request API hwaccels: H.264, HEVC, VP8, VP9, MPEG-1/2,
# MPEG-4/H.263, VC-1, AVS, AVS2 on cedrus) and mpv (v4l2request hwdec + DRM PRIME interop), from out/debs-media
# (scripts/build-media-debs.sh; build.sh runs it for the desktop variant; it skips unchanged sources). The repository
# stays in the image at /opt/opiz2-media as a file: apt source, pinned (version *+opiz2*, priority 1001), so apt keeps
# these builds over the archive's and anything that pulls libav*/mpv later gets them. GStreamer's hardware path is
# v4l2codecs (gstreamer1.0-plugins-bad, every variant); gst-libav (every variant, hw-support packages above) stays
# the software fallback, on the desktop it links against these libav rebuilds.
declare -g OPIZ2_MEDIA_DEBS="${OPIZ2_MEDIA_DEBS:-}"
function post_family_config__opiz2_desktop_media_packages() {
	[[ "${BUILD_DESKTOP}" == "yes" ]] || return 0
	add_packages_to_image mpv ffmpeg
}
function post_repo_customize_image__opiz2_desktop_media() {
	[[ "${BUILD_DESKTOP}" == "yes" ]] || return 0
	local src="${OPIZ2_MEDIA_DEBS:-$(realpath "${USERPATCHES_PATH}/..")/out/debs-media}" dst="${SDCARD}/opt/opiz2-media" p
	for p in ffmpeg libavcodec62 libavutil60 libmpv2 mpv; do
		compgen -G "${src}/${p}_*+opiz2*_*.deb" > /dev/null ||
			exit_with_error "missing the ${p} rebuild in ${src}" "run scripts/build-media-debs.sh (build.sh does it for the desktop variant)"
	done
	mkdir -p "${dst}"
	cp -p "${src}"/*.deb "${src}/Packages" "${dst}/"
	echo "deb [trusted=yes] file:/opt/opiz2-media ./" > "${SDCARD}/etc/apt/sources.list.d/opiz2-media.list"
	cat > "${SDCARD}/etc/apt/preferences.d/opiz2-media.pref" <<- 'PREF'
		# Orange Pi Zero2: FFmpeg with the V4L2 Request API hwaccels and mpv with the v4l2request hwdec
		# (/opt/opiz2-media, built by scripts/build-media-debs.sh). Keep them over the archive's versions.
		# origin "" = local (file:) repositories; apt 3.3 rejects "Pin: version" globs ("Did not understand pin type").
		Package: *
		Pin: origin ""
		Pin-Priority: 1001
	PREF
	chroot_sdcard_apt_get_update
	# Every installed package that has a +opiz2 build, plus mpv/ffmpeg themselves
	local -a ours=() installed
	mapfile -t installed < <(LC_ALL=C chroot "${SDCARD}" dpkg-query -W -f '${Package}\n')
	for p in $(sed -n 's/^Package: //p' "${dst}/Packages" | sort -u); do
		[[ " ${installed[*]} " == *" ${p} "* ]] && ours+=("${p}")
	done
	chroot_sdcard_apt_get_install --allow-downgrades "${ours[@]}" mpv ffmpeg
	local l vers
	vers=$(LC_ALL=C chroot "${SDCARD}" dpkg-query -W -f '${Package} ${Version}\n' libavcodec62 libavutil60 libmpv2 mpv ffmpeg)
	while read -r l; do
		[[ "${l}" == *+opiz2* ]] || exit_with_error "not our build after install" "${l}"
	done <<< "${vers}"
	# mpv: Ubuntu's /etc/mpv/mpv.conf asks for hwdec=vaapi (no VA-API driver here). Ask for the V4L2 Request API
	# hwdec first (DRM PRIME frames into the GPU), then mpv's safe auto list (which our mpv extends with v4l2request-copy).
	# mpv's default hwdec-codecs list leaves out MPEG-1/2/4, H.263, AVS, AVS2 (cedrus decodes them all): allow every codec.
	if [[ -f "${SDCARD}/etc/mpv/mpv.conf" ]]; then
		sed -i -E 's/^hwdec=.*/hwdec=v4l2request,auto-safe/' "${SDCARD}/etc/mpv/mpv.conf"
		grep -q '^hwdec-codecs=' "${SDCARD}/etc/mpv/mpv.conf" || echo 'hwdec-codecs=all' >> "${SDCARD}/etc/mpv/mpv.conf"
	fi
	display_alert "Desktop media" "$(LC_ALL=C chroot "${SDCARD}" dpkg-query -W -f '${Version}' libavcodec62) (${#ours[@]} packages from /opt/opiz2-media)" "info"
}
