# Orange Pi Zero2 (H616) minimal print server
# Usage: ./compile.sh opiz2-printserver
#
# - Ubuntu 26.10 "stonking" userspace (added locally; not in upstream Armbian yet)
# - Armbian "edge" kernel branch = mainline 7.3.x + sunxi-7.3 patch set
# - Broad printer support (see package list below)
# - U-Boot v2026.10 + TF-A lts-v2.14 (Armbian sunxi64 defaults)

BOARD="orangepizero2"
BRANCH="edge"
RELEASE="stonking"

BUILD_MINIMAL="yes"
BUILD_DESKTOP="no"
KERNEL_CONFIGURE="no"
KERNEL_BTF="no"

# apt.armbian.com has no stonking suite; build all Armbian packages locally
# and do not configure the Armbian apt repo in the image.
SKIP_ARMBIAN_REPO="yes"

COMPRESS_OUTPUTIMAGE="sha,img,xz"
EXPERT="yes"

# Build caching (rule #1): ccache for kernel/U-Boot/TF-A, kept in the build tree (cache/ccache) because
# compile.sh runs the compiles as root. Armbian artifact caches (kernel/u-boot/rootfs) are on by default.
enable_extension "ccache"
declare -g PRIVATE_CCACHE=yes

# Print server: CUPS + driverless (IPP Everywhere/AirPrint over network, IPP-over-USB
# via ipp-usb) + every printer-driver-* in the Ubuntu archive + HPLIP + PPD collections.
# Listed explicitly because minimal builds don't install Recommends, so the
# printer-driver-all metapackage alone would pull in nothing.
function post_family_config__opiz2_printserver_packages() {
	add_packages_to_image \
		cups cups-client cups-bsd cups-filters cups-browsed ipp-usb ghostscript \
		avahi-daemon libnss-mdns \
		foomatic-db-compressed-ppds openprinting-ppds hplip \
		printer-driver-brlaser printer-driver-c2050 printer-driver-c2esp printer-driver-cjet \
		printer-driver-dymo printer-driver-escpr printer-driver-foo2zjs printer-driver-fujixerox \
		printer-driver-gutenprint printer-driver-hpcups printer-driver-indexbraille \
		printer-driver-m2300w printer-driver-min12xxw printer-driver-oki printer-driver-pnm2ppa \
		printer-driver-postscript-hp printer-driver-ptouch printer-driver-pxljr \
		printer-driver-sag-gdi printer-driver-splix
}

# Board hardware support (spec acceptance, docs/spec-checklist.md): Mali-G31 userspace
# (panfrost GLES 3.1 + rusticl OpenCL 3.0), plus the tools the hardware tests use:
# video decode (v4l2codecs), HDMI/CEC, IR, audio, GPIO/I2C/SPI-NOR, WiFi/BT, load/latency.
function post_family_config__opiz2_hw_support_packages() {
	add_packages_to_image \
		libgl1-mesa-dri libegl-mesa0 libgles2 mesa-opencl-icd clinfo mesa-utils \
		glmark2-es2-drm kmscube libdrm-tests \
		v4l-utils gstreamer1.0-tools gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-alsa \
		cec-utils ir-keytable evtest alsa-utils \
		gpiod i2c-tools mtd-utils lm-sensors \
		iperf3 bluez stress-ng rt-tests \
		iw wireless-regdb hostapd wpasupplicant
}

# rusticl only exposes drivers listed in RUSTICL_ENABLE.
function image_specific_armbian_env_ready__opiz2_rusticl() {
	grep -q '^RUSTICL_ENABLE=' "${SDCARD}/etc/environment" 2>/dev/null ||
		echo 'RUSTICL_ENABLE=panfrost' >> "${SDCARD}/etc/environment"
}

# OpenCL: Ubuntu's upstream libclc-22 leaves `__clc_flush_denormal_if_not_supported` unresolved,
# so rusticl rejects every kernel that calls sin()/cos() ("nir_shader not fully linked").
# Mesa's libclc fork is the documented drop-in fix (harness/research/impl-gpu-spec.md §3.3).
# Pinned by version + sha256 and cached under cache/sources, so rebuilds do not download it again.
# dpkg-divert keeps an apt upgrade of libclc-22 from putting the broken file back.
declare -g OPIZ2_MESA_LIBCLC_VER="22.1.8.3"
declare -g OPIZ2_MESA_LIBCLC_SHA256="728cdfa747a1857829c104291984964971783a301a62e9468a3d5a4f1750c949"
function post_customize_image__opiz2_mesa_libclc() {
	local f="spirv64-mesa3d-.spv" cache="${SRC}/cache/sources/opiz2-mesa-libclc/${OPIZ2_MESA_LIBCLC_VER}"
	local url="https://gitlab.freedesktop.org/api/v4/projects/27606/packages/generic/mesa-libclc/${OPIZ2_MESA_LIBCLC_VER}/${f}"
	[[ -f "${SDCARD}/usr/lib/clc/${f}" ]] || { display_alert "mesa-libclc" "no libclc in image, skipped" "wrn"; return 0; }
	mkdir -p "${cache}"
	if ! echo "${OPIZ2_MESA_LIBCLC_SHA256}  ${cache}/${f}" | sha256sum -c --status 2> /dev/null; then
		run_host_command_logged curl -fsSL --retry 3 -o "${cache}/${f}.part" "${url}"
		echo "${OPIZ2_MESA_LIBCLC_SHA256}  ${cache}/${f}.part" | sha256sum -c --status ||
			exit_with_error "mesa-libclc ${OPIZ2_MESA_LIBCLC_VER}: sha256 mismatch" "${url}"
		mv "${cache}/${f}.part" "${cache}/${f}"
	fi
	chroot_sdcard dpkg-divert --package opiz2-mesa-libclc --rename \
		--divert "/usr/lib/clc/${f}.distrib" --add "/usr/lib/clc/${f}"
	install -m 0644 "${cache}/${f}" "${SDCARD}/usr/lib/clc/${f}"
	display_alert "mesa-libclc" "${OPIZ2_MESA_LIBCLC_VER} installed over the distro libclc (diverted)" "info"
}

# SD-card wear: root has only the one SD card (the single USB-A port is the printer's).
# Without armbian-config in the image the TUNING_PROFILE never applies, so set the ext4
# root options here once fstab exists: noatime + 10-minute journal commit.
function image_specific_armbian_env_ready__opiz2_sd_wear() {
	sed -i -E 's|^(UUID=[^ ]+ / ext4 defaults)(,errors=remount-ro)|\1,noatime,commit=600\2|' "${SDCARD}/etc/fstab"
	grep -q ' /var/spool/cups ' "${SDCARD}/etc/fstab" ||
		echo 'tmpfs /var/spool/cups tmpfs defaults,nosuid,nodev,mode=0710,uid=root,gid=lp,size=64M 0 0' >> "${SDCARD}/etc/fstab"
	display_alert "SD wear tuning" "noatime,commit=600 on /; CUPS spool on tmpfs" "info"
}

# WiFi regulatory domain (UWE5622). The kernel starts in the world domain "00", where 5 GHz is
# passive-scan/no-IR, so a 5 GHz access point cannot start. The driver passes cfg80211's rules
# to the firmware (drv-net-wireless-uwe5622-regdomain-from-cfg80211.patch). That means the domain
# follows, in order: this knob, then `iw reg set XX`, hostapd's country_code= or wpa_supplicant's
# country=, then the country element of the AP the board associates with.
# Build with OPIZ2_WIFI_REGDOM=US (any ISO 3166 alpha2) to fix it at boot. On a running image,
# edit /etc/modprobe.d/cfg80211-regdom.conf instead; it applies when cfg80211 is next loaded (reboot).
declare -g OPIZ2_WIFI_REGDOM="${OPIZ2_WIFI_REGDOM:-}"
function post_customize_image__opiz2_wifi_regdom() {
	local f="${SDCARD}/etc/modprobe.d/cfg80211-regdom.conf"
	{
		echo "# WiFi regulatory domain at boot (ISO 3166 alpha2). Without it the kernel starts in"
		echo "# the world domain \"00\" and follows iw reg set / hostapd country_code= / the AP's"
		echo "# country element. 5 GHz AP mode needs a real country. Reboot to apply."
		if [[ "${OPIZ2_WIFI_REGDOM}" =~ ^[A-Z]{2}$ ]]; then
			echo "options cfg80211 ieee80211_regdom=${OPIZ2_WIFI_REGDOM}"
		else
			echo "#options cfg80211 ieee80211_regdom=US"
		fi
	} > "${f}"
	display_alert "WiFi regulatory domain" "${OPIZ2_WIFI_REGDOM:-follow AP/user (world 00 at boot)}" "info"
}
